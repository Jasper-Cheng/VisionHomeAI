<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>用户 · VisionHomeAI</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header" role="banner">
      <div class="header-inner header-inner--simple">
        <div class="header-left">
          <a class="brand" href="./index.html" aria-label="VisionHomeAI">
            <span class="brand-mark" aria-hidden="true">
              <svg class="brand-icon" viewBox="0 0 64 64" aria-hidden="true">
                <rect x="4" y="4" width="56" height="56" rx="18" fill="#4a49b8" />
                <path
                  d="M22 40c4.5 5.2 15.5 5.2 20 0"
                  fill="none"
                  stroke="rgba(255,255,255,0.72)"
                  stroke-width="6"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <span class="brand-text">
              VisionHome<span class="brand-ai">AI</span>
            </span>
          </a>
        </div>
        <div class="header-right">
          <div class="header-search" role="search">
            <span class="header-search-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
                <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </span>
            <input
              class="header-search-input"
              type="search"
              placeholder="搜索模型、风格、品牌..."
              aria-label="搜索户型、家具、文件"
            />
          </div>
          <a class="icon-btn header-back-btn" href="./index.html" aria-label="返回">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"
              />
            </svg>
          </a>
        </div>
      </div>
    </header>

    <main class="user-page-main" role="main">
      <!-- Left sidebar: categories -->
      <aside class="user-sidebar" aria-label="分类导航">

        <!-- 户型分类 -->
        <section class="ucat-group">
          <div class="ucat-group-head">
            <span class="ucat-group-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M3 9.5L12 3l9 6.5V21H3V9.5z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <rect x="9" y="14" width="6" height="7" rx="1" stroke="currentColor" stroke-width="1.6"/>
              </svg>
            </span>
            <span class="ucat-group-title">户型分类</span>
          </div>
          <ul class="ucat-list" role="list">
            <li class="ucat-item is-active" role="listitem">
              <span class="ucat-label">全部户型</span>
              <span class="ucat-count">318</span>
            </li>
            <li class="ucat-item" role="listitem">
              <span class="ucat-label">小户型</span>
              <span class="ucat-count">84</span>
            </li>
            <li class="ucat-item" role="listitem">
              <span class="ucat-label">两居室</span>
              <span class="ucat-count">96</span>
            </li>
            <li class="ucat-item" role="listitem">
              <span class="ucat-label">三居室</span>
              <span class="ucat-count">72</span>
            </li>
            <li class="ucat-item" role="listitem">
              <span class="ucat-label">别墅/复式</span>
              <span class="ucat-count">40</span>
            </li>
            <li class="ucat-item" role="listitem">
              <span class="ucat-label">商业空间</span>
              <span class="ucat-count">26</span>
            </li>
          </ul>
        </section>

        <div class="ucat-divider"></div>

        <!-- 家具分类 -->
        <section class="ucat-group">
          <div class="ucat-group-head">
            <span class="ucat-group-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <rect x="2" y="13" width="20" height="5" rx="2" stroke="currentColor" stroke-width="1.8"/>
                <path d="M4 13V9a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v4" stroke="currentColor" stroke-width="1.8"/>
                <path d="M6 18v2M18 18v2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="ucat-group-title">家具分类</span>
          </div>
          <ul class="ucat-list" role="list">
            <li class="ucat-item" role="listitem">
              <span class="ucat-label">全部家具</span>
              <span class="ucat-count">4,209</span>
            </li>
            <li class="ucat-item" role="listitem">
              <span class="ucat-label">客厅居室</span>
              <span class="ucat-count">1,120</span>
            </li>
            <li class="ucat-item" role="listitem">
              <span class="ucat-label">餐厅厨卫</span>
              <span class="ucat-count">894</span>
            </li>
            <li class="ucat-item" role="listitem">
              <span class="ucat-label">温馨卧室</span>
              <span class="ucat-count">1,245</span>
            </li>
            <li class="ucat-item" role="listitem">
              <span class="ucat-label">书房办公</span>
              <span class="ucat-count">630</span>
            </li>
            <li class="ucat-item" role="listitem">
              <span class="ucat-label">户外花园</span>
              <span class="ucat-count">320</span>
            </li>
          </ul>
        </section>

        <div class="ucat-divider"></div>

        <!-- 文件分类 -->
        <section class="ucat-group">
          <div class="ucat-group-head">
            <span class="ucat-group-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M4 4h10l4 4v12a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M14 4v4h4" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
                <path d="M7 12h10M7 15.5h6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
              </svg>
            </span>
            <span class="ucat-group-title">文件分类</span>
          </div>
          <ul class="ucat-list" role="list">
            <li class="ucat-item" role="listitem">
              <span class="ucat-label">全部文件</span>
              <span class="ucat-count">57</span>
            </li>
            <li class="ucat-item" role="listitem">
              <span class="ucat-label">设计方案</span>
              <span class="ucat-count">18</span>
            </li>
            <li class="ucat-item" role="listitem">
              <span class="ucat-label">户型图纸</span>
              <span class="ucat-count">14</span>
            </li>
            <li class="ucat-item" role="listitem">
              <span class="ucat-label">效果图</span>
              <span class="ucat-count">16</span>
            </li>
            <li class="ucat-item" role="listitem">
              <span class="ucat-label">报价清单</span>
              <span class="ucat-count">9</span>
            </li>
          </ul>
        </section>

      </aside>

      <!-- Right content -->
      <div class="user-page-content">

        <!-- Top bar -->
        <div class="ucontent-topbar">
          <span class="ucontent-count">显示 1 – 12 / 共 <strong>4,209</strong> 个模型</span>
          <div class="ucontent-sort">
            <span class="ucontent-sort-label">排序方式：</span>
            <button class="ucontent-sort-btn" aria-haspopup="listbox">
              最近更新
              <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
            </button>
          </div>
        </div>

        <!-- Middle: content grid (placeholder) -->
        <div class="ucontent-body">
        </div>

        <!-- Bottom: pagination (placeholder) -->
        <div class="ucontent-bottom">
        </div>

      </div>
    </main>
  </body>
</html>
