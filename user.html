<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>用户 · VisionHomeAI</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header" role="banner">
      <div class="header-inner header-inner--simple">
        <div class="header-left">
          <a class="brand" href="./index.html" aria-label="VisionHomeAI">
            <span class="brand-mark" aria-hidden="true">
              <svg class="brand-icon" viewBox="0 0 64 64" aria-hidden="true">
                <rect x="4" y="4" width="56" height="56" rx="18" fill="#4a49b8" />
                <path
                  d="M22 40c4.5 5.2 15.5 5.2 20 0"
                  fill="none"
                  stroke="rgba(255,255,255,0.72)"
                  stroke-width="6"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <span class="brand-text">
              VisionHome<span class="brand-ai">AI</span>
            </span>
          </a>
        </div>
        <div class="header-right">
          <div class="header-search" role="search">
            <span class="header-search-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="11" cy="11" r="7" stroke="currentColor" stroke-width="2"/>
                <path d="M16.5 16.5L21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
              </svg>
            </span>
            <input
              class="header-search-input"
              type="search"
              placeholder="搜索模型、风格、品牌..."
              aria-label="搜索户型、家具、文件"
            />
          </div>
          <a class="icon-btn header-back-btn" href="./index.html" aria-label="返回">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"
              />
            </svg>
          </a>
        </div>
      </div>
    </header>

    <main class="user-page-main" role="main">
      <div class="user-page-inner">
        <h1 class="user-page-title">用户中心</h1>
        <p class="user-page-desc">在此管理账户与偏好设置。</p>
      </div>
    </main>
  </body>
</html>
