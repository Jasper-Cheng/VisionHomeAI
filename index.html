<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisionHomeAI</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="app-header" role="banner">
      <div class="header-inner">
        <div class="header-left">
          <a class="brand" href="#" aria-label="VisionHomeAI">
            <span class="brand-mark" aria-hidden="true">
              <svg class="brand-icon" viewBox="0 0 64 64" aria-hidden="true">
                <rect x="4" y="4" width="56" height="56" rx="18" fill="#4a49b8" />
                <path
                  d="M22 40c4.5 5.2 15.5 5.2 20 0"
                  fill="none"
                  stroke="rgba(255,255,255,0.72)"
                  stroke-width="6"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <span class="brand-text">
              VisionHome<span class="brand-ai">AI</span>
            </span>
          </a>

          <span class="divider" aria-hidden="true"></span>

          <nav class="nav-segment" aria-label="主导航">
            <a class="seg-item is-active" href="#">编辑模型</a>
            <a class="seg-item" href="#">2D户型</a>
            <a class="seg-item" href="#">全景漫游</a>
          </nav>
        </div>

        <div class="header-right">
          <button class="btn-primary" type="button">云端备份</button>
          <button class="btn-primary" type="button">语音控制</button>

          <button class="icon-btn" type="button" aria-label="分享">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7a3.27 3.27 0 0 0 0-1.39l7-4.11A2.99 2.99 0 1 0 14 5a3 3 0 0 0 .05.51l-7 4.11a3 3 0 1 0 0 4.76l7.05 4.12A3 3 0 1 0 18 16.08Z"
              />
            </svg>
          </button>

          <button class="avatar" type="button" aria-label="用户">
            <span class="avatar-text">ID</span>
          </button>
        </div>
      </div>
    </header>

    <main class="app-main" role="main">
      <aside class="left-rail" aria-label="侧边栏">
        <div class="rail-group" role="group" aria-label="工具">
          <button class="rail-btn is-active" type="button" aria-label="家具库" data-panel="assets">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M7 11c-1.66 0-3 1.34-3 3v4h2v-2h12v2h2v-4c0-1.66-1.34-3-3-3h-1V9c0-1.1-.9-2-2-2H9c-1.1 0-2 .9-2 2v2H7Zm2-2h6v2H9V9Z"
              />
            </svg>
          </button>

          <button class="rail-btn" type="button" aria-label="设置" data-panel="settings">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M19.4 13a7.8 7.8 0 0 0 .1-2l2-1.5-2-3.4-2.4 1a8.3 8.3 0 0 0-1.7-1l-.3-2.6H11l-.3 2.6a8.3 8.3 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.5a7.8 7.8 0 0 0 .1 2l-2 1.5 2 3.4 2.4-1a8.3 8.3 0 0 0 1.7 1l.3 2.6h4.2l.3-2.6a8.3 8.3 0 0 0 1.7-1l2.4 1 2-3.4-2-1.5ZM13 12a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"
              />
            </svg>
          </button>
        </div>
      </aside>

      <section class="app-content" aria-label="内容区">
        <div id="viewer" class="viewer" aria-label="3D区域"></div>

        <section id="propertiesPanel" class="properties-panel" aria-label="属性面板">
          <div class="properties-head">
            <div class="properties-title">
              物体属性 - <span class="properties-name">未选择</span>
            </div>
          </div>

          <div class="properties-body">
            <div class="prop-row">
              <div class="prop-label">部件数</div>
              <div class="prop-value" data-prop="parts">—</div>
            </div>

            <div class="prop-divider"></div>

            <div class="prop-group">
              <div class="prop-group-title">位置</div>
              <div class="prop-cols">
                <div class="prop-sub">
                  <div class="prop-label">X</div>
                  <div class="prop-value" data-prop="x">0</div>
                </div>
                <div class="prop-sub">
                  <div class="prop-label">Y</div>
                  <div class="prop-value" data-prop="y">0</div>
                </div>
                <div class="prop-sub">
                  <div class="prop-label">Z</div>
                  <div class="prop-value" data-prop="z">0</div>
                </div>
              </div>
            </div>

            <div class="prop-group">
              <div class="prop-group-title">旋转（Y）</div>
              <div class="prop-cols">
                <div class="prop-sub" style="width: 100%;">
                  <div class="prop-label">Yaw</div>
                  <div class="prop-value" data-prop="rotY">0</div>
                </div>
              </div>
            </div>

            <div class="prop-divider"></div>

            <div class="prop-group">
              <div class="prop-group-title">材质/颜色（示例）</div>
              <div class="color-row">
                <div class="color-dot" aria-hidden="true" data-color="primary"></div>
                <div class="color-dot" aria-hidden="true" data-color="secondary"></div>
                <div class="color-dot is-selected" aria-hidden="true" data-color="accent"></div>
              </div>
            </div>
          </div>
        </section>

        <section class="side-panel is-visible" data-panel="assets" aria-label="家具库面板">
          <div class="panel-header">
            <div class="panel-title">家具库</div>
            <label class="search" aria-label="搜索模型">
              <span class="search-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path
                    fill="currentColor"
                    d="M10.5 3a7.5 7.5 0 1 1 4.67 13.36l3.48 3.48-1.41 1.41-3.48-3.48A7.5 7.5 0 0 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"
                  />
                </svg>
              </span>
              <input class="search-input" type="search" placeholder="搜索模型..." />
            </label>
          </div>

          <div class="panel-tabs" role="tablist" aria-label="分类">
            <button class="tab is-active" type="button" role="tab" aria-selected="true">全部</button>
            <button class="tab" type="button" role="tab" aria-selected="false">沙发</button>
            <button class="tab" type="button" role="tab" aria-selected="false">椅子</button>
            <button class="tab" type="button" role="tab" aria-selected="false">桌几</button>
            <button class="tab" type="button" role="tab" aria-selected="false">床</button>
            <button class="tab" type="button" role="tab" aria-selected="false">床垫</button>
            <button class="tab" type="button" role="tab" aria-selected="false">柜类</button>
            <button class="tab" type="button" role="tab" aria-selected="false">收纳</button>
            <button class="tab" type="button" role="tab" aria-selected="false">电视柜</button>
            <button class="tab" type="button" role="tab" aria-selected="false">书桌/办公</button>
            <button class="tab" type="button" role="tab" aria-selected="false">餐桌椅</button>
            <button class="tab" type="button" role="tab" aria-selected="false">灯具</button>
            <button class="tab" type="button" role="tab" aria-selected="false">厨卫</button>
            <button class="tab" type="button" role="tab" aria-selected="false">软装</button>
            <button class="tab" type="button" role="tab" aria-selected="false">地毯</button>
            <button class="tab" type="button" role="tab" aria-selected="false">窗帘</button>
            <button class="tab" type="button" role="tab" aria-selected="false">装饰画</button>
            <button class="tab" type="button" role="tab" aria-selected="false">摆件</button>
            <button class="tab" type="button" role="tab" aria-selected="false">绿植</button>
            <button class="tab" type="button" role="tab" aria-selected="false">家电</button>
            <button class="tab" type="button" role="tab" aria-selected="false">门窗</button>
            <button class="tab" type="button" role="tab" aria-selected="false">建模结构</button>
          </div>

          <div class="asset-grid" aria-label="家具列表">
            <article class="asset-card" data-model="sofa" tabindex="0" role="button" aria-label="北欧灰布艺沙发">
              <div class="asset-thumb">
                <div class="thumb-skeleton"></div>
              </div>
              <div class="asset-name">北欧灰布艺沙发</div>
            </article>
            <article class="asset-card" data-model="table" tabindex="0" role="button" aria-label="原木简约茶几">
              <div class="asset-thumb">
                <div class="thumb-skeleton thumb-skeleton--green"></div>
              </div>
              <div class="asset-name">原木简约茶几</div>
            </article>
            <article class="asset-card" data-model="lamp" tabindex="0" role="button" aria-label="极简落地灯">
              <div class="asset-thumb">
                <div class="thumb-skeleton thumb-skeleton--warm"></div>
              </div>
              <div class="asset-name">极简落地灯</div>
            </article>
            <article class="asset-card" data-model="rug" tabindex="0" role="button" aria-label="几何抽象地毯">
              <div class="asset-thumb">
                <div class="thumb-skeleton thumb-skeleton--red"></div>
              </div>
              <div class="asset-name">几何抽象地毯</div>
            </article>
            <article class="asset-card" data-model="tv-cabinet" tabindex="0" role="button" aria-label="悬浮式电视柜">
              <div class="asset-thumb">
                <div class="thumb-skeleton thumb-skeleton--gray"></div>
              </div>
              <div class="asset-name">悬浮式电视柜</div>
            </article>
            <article class="asset-card" data-model="plant" tabindex="0" role="button" aria-label="大叶天堂鸟">
              <div class="asset-thumb">
                <div class="thumb-skeleton thumb-skeleton--blue"></div>
              </div>
              <div class="asset-name">大叶天堂鸟</div>
            </article>
          </div>

          <div class="panel-footer">
            <div class="ai-box">
              <div class="ai-top">
                <span class="ai-badge">AI 推荐</span>
              </div>
              <div class="ai-tags" aria-label="常用风格">
                <button class="ai-tag" type="button">现代简约</button>
                <button class="ai-tag" type="button">北欧</button>
                <button class="ai-tag" type="button">原木</button>
                <button class="ai-tag" type="button">轻奢</button>
                <button class="ai-tag" type="button">工业风</button>
                <button class="ai-tag" type="button">奶油风</button>
              </div>
            </div>
          </div>
        </section>

        <section class="side-panel" data-panel="settings" aria-label="设置面板">
          <div class="panel-header">
            <div class="panel-title">设置</div>
          </div>
          <div class="panel-empty">这里放你的设置项。</div>
        </section>
      </section>
    </main>

    <script type="importmap">
      {
        "imports": {
          "three": "./public/three.module.js"
        }
      }
    </script>

    <script type="module" src="./viewer.js"></script>
    <script src="./app.js"></script>
  </body>
</html>
