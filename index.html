<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VisionHomeAI</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <!-- file:// 打开时提示需本地 HTTP；模块加载失败时由下方脚本写入 -->
    <div
      id="visionHomeBootBanner"
      class="vision-home-boot-banner"
      hidden
      role="alert"
      aria-live="polite"
    ></div>
    <script>
      (function () {
        try {
          if (location.protocol === "file:") {
            var el = document.getElementById("visionHomeBootBanner");
            if (el) {
              el.hidden = false;
              el.textContent =
                "当前是 file:// 打开，浏览器会阻止 ES Module，脚本不会运行。请在项目根目录执行：python3 -m http.server 8080，然后访问 http://localhost:8080/index.html";
            }
          }
        } catch (e) {
          /* ignore */
        }
      })();
    </script>
    <header class="app-header" role="banner">
      <div class="header-inner">
        <div class="header-left">
          <a class="brand" href="./user.html" aria-label="VisionHomeAI">
            <span class="brand-mark" aria-hidden="true">
              <svg class="brand-icon" viewBox="0 0 64 64" aria-hidden="true">
                <rect x="4" y="4" width="56" height="56" rx="18" fill="#4a49b8" />
                <path
                  d="M22 40c4.5 5.2 15.5 5.2 20 0"
                  fill="none"
                  stroke="rgba(255,255,255,0.72)"
                  stroke-width="6"
                  stroke-linecap="round"
                />
              </svg>
            </span>
            <span class="brand-text">
              VisionHome<span class="brand-ai">AI</span>
            </span>
          </a>

          <span class="divider" aria-hidden="true"></span>

          <nav class="nav-segment" aria-label="主导航">
            <a class="seg-item is-active" href="#" data-app-view="edit">编辑模式</a>
            <a class="seg-item" href="#" data-app-view="panorama">全景漫游</a>
          </nav>

          <div class="header-save-group">
            <button class="btn-primary btn-save" type="button" id="btnNewScene">新建场景</button>
            <button class="btn-primary btn-save" type="button" id="btnSave" disabled>保存</button>
            <span class="current-design-file-label" id="currentDesignFileLabel" aria-live="polite">未保存文件</span>
          </div>
        </div>

        <div class="header-right">
          <button class="btn-primary" type="button">云端备份</button>
          <button class="btn-primary" type="button">语音控制</button>

          <button class="icon-btn" type="button" aria-label="分享">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7a3.27 3.27 0 0 0 0-1.39l7-4.11A2.99 2.99 0 1 0 14 5a3 3 0 0 0 .05.51l-7 4.11a3 3 0 1 0 0 4.76l7.05 4.12A3 3 0 1 0 18 16.08Z"
              />
            </svg>
          </button>

          <a class="avatar" href="./user.html" aria-label="用户">
            <span class="avatar-text">ID</span>
          </a>
        </div>
      </div>
    </header>

    <main class="app-main" id="appMain" role="main">
      <!-- 编辑模式：左侧栏 + 内容区 -->
      <div class="app-view app-view--edit is-active" id="appViewEdit" data-app-view="edit">
      <aside class="left-rail" aria-label="侧边栏">
        <div class="rail-group" role="group" aria-label="工具">
          <button class="rail-btn is-active" type="button" aria-label="户型库" data-panel="floorplans">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"
              />
            </svg>
          </button>
          <button class="rail-btn" type="button" aria-label="家具库" data-panel="assets">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M3 3v18h18V3H3zm16 16H5V5h14v14zM7 7h4v4H7V7zm6 0h4v2h-4V7zm0 4h4v2h-4v-2zm-6 4h4v2H7v-2z"
              />
            </svg>
          </button>

          <button class="rail-btn" type="button" aria-label="设计文件" data-panel="files">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <path
                fill="currentColor"
                d="M10 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"
              />
            </svg>
          </button>
        </div>
      </aside>

      <section class="app-content" aria-label="内容区">
        <!-- 左侧库面板：flex 占位，避免盖住平面图编辑区 -->
        <section class="side-panel is-visible" data-panel="floorplans" aria-label="户型库面板">
          <div class="panel-header">
            <div class="panel-title">户型库</div>
            <label class="search" aria-label="搜索户型">
              <span class="search-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path
                    fill="currentColor"
                    d="M10.5 3a7.5 7.5 0 1 1 4.67 13.36l3.48 3.48-1.41 1.41-3.48-3.48A7.5 7.5 0 0 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"
                  />
                </svg>
              </span>
              <input class="search-input" type="search" placeholder="搜索户型..." />
            </label>
          </div>

          <div class="panel-catalog-body">
            <div class="panel-tabs floorplan-tabs" role="tablist" aria-label="户型分类"></div>
            <div class="asset-grid floorplan-asset-grid" id="floorPlanGrid" aria-label="户型列表"></div>
          </div>

          <div class="panel-footer">
            <div class="ai-box">
              <div class="ai-top">
                <span class="ai-badge">AI 推荐</span>
              </div>
              <div class="ai-tags" aria-label="常用户型特征">
                <button class="ai-tag" type="button">南北通透</button>
                <button class="ai-tag" type="button">全明边套</button>
                <button class="ai-tag" type="button">动静分区</button>
                <button class="ai-tag" type="button">LDK 一体</button>
                <button class="ai-tag" type="button">双卫</button>
                <button class="ai-tag" type="button">大面宽</button>
              </div>
            </div>
          </div>
        </section>

        <section class="side-panel" data-panel="assets" aria-label="家具库面板">
          <div class="panel-header">
            <div class="panel-title">家具库</div>
            <label class="search" aria-label="搜索家具">
              <span class="search-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path
                    fill="currentColor"
                    d="M10.5 3a7.5 7.5 0 1 1 4.67 13.36l3.48 3.48-1.41 1.41-3.48-3.48A7.5 7.5 0 0 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"
                  />
                </svg>
              </span>
              <input class="search-input" type="search" placeholder="搜索家具..." />
            </label>
          </div>

          <div class="panel-catalog-body">
            <div class="panel-tabs furniture-tabs" role="tablist" aria-label="家具分类"></div>
            <div class="asset-grid furniture-asset-grid" id="furnitureAssetGrid" aria-label="家具列表"></div>
          </div>

          <div class="panel-footer">
            <div class="ai-box">
              <div class="ai-top">
                <span class="ai-badge">AI 推荐</span>
              </div>
              <div class="ai-tags" aria-label="常用风格">
                <button class="ai-tag" type="button">现代简约</button>
                <button class="ai-tag" type="button">北欧</button>
                <button class="ai-tag" type="button">原木</button>
                <button class="ai-tag" type="button">轻奢</button>
                <button class="ai-tag" type="button">工业风</button>
                <button class="ai-tag" type="button">奶油风</button>
              </div>
            </div>
          </div>
        </section>

        <section class="side-panel" data-panel="files" aria-label="设计文件面板">
          <div class="panel-header">
            <div class="panel-title">设计文件</div>
            <label class="search" aria-label="搜索设计">
              <span class="search-icon" aria-hidden="true">
                <svg viewBox="0 0 24 24">
                  <path
                    fill="currentColor"
                    d="M10.5 3a7.5 7.5 0 1 1 4.67 13.36l3.48 3.48-1.41 1.41-3.48-3.48A7.5 7.5 0 0 1 10.5 3Zm0 2a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11Z"
                  />
                </svg>
              </span>
              <input
                id="designFileSearchInput"
                class="search-input file-search-input"
                type="search"
                placeholder="搜索设计..."
                autocomplete="off"
              />
            </label>
          </div>
          <div class="file-list" id="designFileList" aria-label="设计文件列表"></div>
        </section>
        <div class="svg-editor-slot" id="svgEditorSlot">
          <div class="svg-editor" aria-label="SVG户型编辑区">
            <header class="svg-editor-toolbar">
              <div class="svg-editor-toolbar-left">
                <span class="svg-editor-title">户型平面图</span>
                <span class="svg-editor-hint">
                  家具/户型：<strong>拖到画布</strong>放置 · 户型<strong>点击拖动</strong>、<strong>Delete</strong>删除 · <strong>Shift+点击</strong>户型/家具加到中心 · 家具双击旋转 · <strong>滚轮</strong>缩放 · <strong>左键拖空白</strong>或<strong>中键</strong>平移 · <strong>Ctrl+Z</strong>撤销
                </span>
              </div>
              <div
                class="svg-editor-view-controls"
                role="toolbar"
                aria-label="画布平移与缩放"
              >
                <button
                  type="button"
                  class="svg-view-btn svg-view-btn--wide is-active"
                  id="svgGridToggleBtn"
                  data-svg-grid-toggle
                  title="显示/隐藏网格"
                  aria-label="显示或隐藏网格"
                  aria-pressed="true"
                >
                  网格
                </button>
                <button type="button" class="svg-view-btn svg-view-btn--wide" data-svg-undo title="上一步 (Ctrl+Z)" aria-label="上一步">
                  上一步
                </button>
                <button type="button" class="svg-view-btn svg-view-btn--wide" data-svg-redo title="下一步 (Ctrl+Shift+Z)" aria-label="下一步">
                  下一步
                </button>
                <button
                  type="button"
                  class="svg-view-btn svg-view-btn--wide"
                  data-svg-floorplan-clear
                  title="删除画布上的户型底图"
                  aria-label="删除户型底图"
                >
                  删户型
                </button>
                <span class="svg-view-sep" aria-hidden="true"></span>
                <button type="button" class="svg-view-btn" data-svg-pan="left" title="向左平移" aria-label="向左平移">
                  ←
                </button>
                <button type="button" class="svg-view-btn" data-svg-pan="right" title="向右平移" aria-label="向右平移">
                  →
                </button>
                <button type="button" class="svg-view-btn" data-svg-pan="up" title="向上平移" aria-label="向上平移">
                  ↑
                </button>
                <button type="button" class="svg-view-btn" data-svg-pan="down" title="向下平移" aria-label="向下平移">
                  ↓
                </button>
                <span class="svg-view-sep" aria-hidden="true"></span>
                <button type="button" class="svg-view-btn" data-svg-zoom="in" title="放大" aria-label="放大">
                  +
                </button>
                <button type="button" class="svg-view-btn" data-svg-zoom="out" title="缩小" aria-label="缩小">
                  −
                </button>
                <button type="button" class="svg-view-btn svg-view-btn--wide" data-svg-reset="1" title="复位视图" aria-label="复位视图">
                  复位
                </button>
              </div>
            </header>
            <div class="svg-editor-canvas-wrap">
              <svg
                class="svg-editor-canvas"
                id="svgEditorCanvas"
                viewBox="0 0 3000 3000"
                xmlns="http://www.w3.org/2000/svg"
                preserveAspectRatio="xMidYMid slice"
                aria-label="可编辑户型 SVG 画布（3000×3000）"
              >
                <defs>
                  <pattern id="svgEditorGrid" width="20" height="20" patternUnits="userSpaceOnUse">
                    <path d="M 20 0 L 0 0 0 20" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />
                  </pattern>
                </defs>
                <g id="svgEditorViewRoot" transform="translate(0 0) scale(1)">
                  <rect class="svg-editor-bg" width="100%" height="100%" fill="#0d0d0d" />
                  <rect
                    id="svgEditorGridLayer"
                    class="svg-editor-bg svg-editor-grid-layer"
                    width="100%"
                    height="100%"
                    fill="url(#svgEditorGrid)"
                  />
                </g>
              </svg>
              <div class="viewer-bottom-ui" aria-hidden="true">
                <div class="bottom-ui-left">
                  <span class="bottom-ui-icon" aria-hidden="true">🏠</span>
                  <div class="bottom-ui-text">
                    <div class="bottom-ui-title">实时预算(BOM)</div>
                    <div class="bottom-ui-price">¥12,480.00</div>
                  </div>
                </div>

                <div class="bottom-ui-divider" aria-hidden="true"></div>

                <div class="bottom-ui-right">
                  <span class="bottom-ui-check" aria-hidden="true">✓</span>
                  <div class="bottom-ui-text">
                    <div class="bottom-ui-link">空间利用率</div>
                    <div class="bottom-ui-rate">
                      <span class="bottom-ui-rate-percent">78%</span>
                      <span class="bottom-ui-rate-level">优秀</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>

        <section id="propertiesPanel" class="properties-panel" aria-label="属性面板">
          <div class="properties-head">
            <span class="properties-head-icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path fill="currentColor" d="M19.4 13a7.8 7.8 0 0 0 .1-2l2-1.5-2-3.4-2.4 1a8.3 8.3 0 0 0-1.7-1l-.3-2.6H11l-.3 2.6a8.3 8.3 0 0 0-1.7 1l-2.4-1-2 3.4 2 1.5a7.8 7.8 0 0 0 .1 2l-2 1.5 2 3.4 2.4-1a8.3 8.3 0 0 0 1.7 1l.3 2.6h4.2l.3-2.6a8.3 8.3 0 0 0 1.7-1l2.4 1 2-3.4-2-1.5ZM13 12a1 1 0 1 1-2 0 1 1 0 0 1 2 0Z"/></svg>
            </span>
            <div class="properties-title">
              物体属性 - <span class="properties-name">未选择</span>
            </div>
          </div>

          <div class="properties-body">
            <div class="prop-transform">
              <div class="prop-input-group">
                <label class="prop-input-label">位置 X</label>
                <input class="prop-input" type="text" data-prop="x" value="0" />
              </div>
              <div class="prop-input-group">
                <label class="prop-input-label">位置 Y</label>
                <input class="prop-input" type="text" data-prop="z" value="0" />
              </div>
              <div class="prop-input-group">
                <label class="prop-input-label">旋转 °</label>
                <input class="prop-input" type="text" data-prop="rotY" value="0" />
              </div>
            </div>
            <div class="prop-scale-row">
              <span class="prop-scale-label">等比例缩放</span>
              <label class="prop-toggle">
                <input type="checkbox" class="prop-toggle-input" data-prop="uniformScale" checked />
                <span class="prop-toggle-slider"></span>
              </label>
            </div>

            <div class="prop-divider"></div>

            <div class="prop-section">
              <div class="prop-section-title">材质与面料</div>
              <div class="prop-material-tiles">
                <button class="prop-material-tile is-selected" type="button" data-material="fabric" aria-label="白色布艺">
                  <span class="material-preview material-fabric"></span>
                </button>
                <button class="prop-material-tile" type="button" data-material="leather" aria-label="棕橙皮革">
                  <span class="material-preview material-leather"></span>
                </button>
                <button class="prop-material-tile" type="button" data-material="velvet" aria-label="深蓝丝绒">
                  <span class="material-preview material-velvet"></span>
                </button>
                <button class="prop-material-tile prop-material-add" type="button" aria-label="添加材质">
                  <span class="material-add-icon">+</span>
                </button>
              </div>
            </div>

            <div class="prop-section">
              <div class="prop-section-title">颜色系列</div>
              <div class="prop-color-row">
                <div class="prop-color-swatches">
                  <button class="prop-color-swatch is-selected" type="button" data-color="#8c7cff" style="--swatch:#8c7cff" aria-label="紫色"></button>
                  <button class="prop-color-swatch" type="button" data-color="#6b7280" style="--swatch:#6b7280" aria-label="灰色"></button>
                  <button class="prop-color-swatch" type="button" data-color="#14b8a6" style="--swatch:#14b8a6" aria-label="青绿"></button>
                  <button class="prop-color-swatch" type="button" data-color="#f97316" style="--swatch:#f97316" aria-label="橙色"></button>
                  <button class="prop-color-swatch" type="button" data-color="#f5f5dc" style="--swatch:#f5f5dc" aria-label="米白"></button>
                </div>
                <div class="prop-color-divider"></div>
                <button class="prop-color-custom" type="button" aria-label="自定义颜色">
                  <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 3a9 9 0 0 1 9 9c0 .46-.04-.92-.1-1.36a5.389 5.389 0 0 0-1.01 2.27 6.998 6.998 0 0 1 2.09 2.04C21.95 12.28 22 12.64 22 13a9 9 0 0 1-9 9c-.36 0-.72-.05-1.07-.14a6.998 6.998 0 0 1-2.04-2.09 5.391 5.391 0 0 0-2.27 1.01c.44.06.9.1 1.36.1a9 9 0 0 0 9-9c0-.46-.04-.92-.1-1.36a5.389 5.389 0 0 0 1.01-2.27 6.998 6.998 0 0 1-2.09-2.04C20.05 11.72 20 11.36 20 11a9 9 0 0 0-9-9c-.36 0-.72.05-1.07.14a6.998 6.998 0 0 1 2.04 2.09 5.391 5.391 0 0 0 2.27-1.01C11.54 3.04 12 3 12.46 3H12Z"/></svg>
                </button>
              </div>
            </div>

            <div class="prop-section">
              <div class="prop-section-title">高级设置</div>
              <div class="prop-setting-row">
                <span class="prop-setting-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path fill="currentColor" d="M13 2.05v2.02c3.95.49 7 3.85 7 7.93 0 3.95-3.05 7.44-7 7.93v2.02c5.05-.5 9-4.76 9-9.95 0-5.19-3.95-9.45-9-9.95ZM11 19.93v-2.02c-3.95-.49-7-3.84-7-7.93 0-3.95 3.05-7.44 7-7.93V2.05c-5.05.5-9 4.76-9 9.95 0 5.19 3.95 9.45 9 9.95Zm2-14.88V4.05c2.7.12 5.16 1.39 6.86 3.48l-1.43 1.43A7.93 7.93 0 0 0 13 5.05Zm-4.43 4.43 1.43-1.43A7.93 7.93 0 0 0 11 18.95v1.99c2.7-.12 5.16-1.39 6.86-3.48l-1.43-1.43A5.97 5.97 0 0 1 13 17.05Z"/></svg>
                </span>
                <span class="prop-setting-text">开启磁吸吸附</span>
                <label class="prop-toggle">
                  <input type="checkbox" class="prop-toggle-input" data-prop="magneticSnap" checked />
                  <span class="prop-toggle-slider"></span>
                </label>
              </div>
              <div class="prop-setting-row">
                <span class="prop-setting-icon" aria-hidden="true">
                  <svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2Zm-1 17.93c-3.95-.49-7-3.84-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93Zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39Z"/></svg>
                </span>
                <span class="prop-setting-text">穿模检测反馈</span>
                <label class="prop-toggle">
                  <input type="checkbox" class="prop-toggle-input" data-prop="collisionFeedback" />
                  <span class="prop-toggle-slider"></span>
                </label>
              </div>
            </div>
          </div>
        </section>

      </section>
      </div>

      <!-- 全景漫游：仅 3D 区域 + 快捷入口 -->
      <div class="app-view app-view--panorama" id="appViewPanorama" data-app-view="panorama">
        <section class="app-content app-content--panorama" aria-label="全景漫游">
          <div class="viewer-cluster-slot viewer-cluster-slot--panorama" id="viewerClusterSlotPanorama">
            <div class="viewer-cluster" id="viewerCluster">
              <div id="viewer" class="viewer" aria-label="3D区域"></div>

              <div class="content-icons" aria-label="快捷入口">
                <button class="content-icon is-active" type="button" aria-label="重置" data-action="reset-view">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5ZM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5Zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3Z"
                    />
                  </svg>
                </button>

                <button class="content-icon" type="button" aria-label="切换网格" data-action="toggle-grid">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="M4 4h7v7H4V4Zm9 0h7v7h-7V4ZM4 13h7v7H4v-7Zm9 0h7v7h-7v-7Z"
                    />
                  </svg>
                </button>
                <button class="content-icon" type="button" aria-label="切换地面" data-action="toggle-ground">
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="M12 3 2 8l10 5 10-5-10-5Zm-9 8.1V19l9 4 9-4v-7.9l-9 4.5-9-4.5Z"
                    />
                  </svg>
                </button>

                <button class="content-icon" type="button" aria-label="上一步（撤回）" data-action="history-back" disabled>
                  <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path
                      fill="currentColor"
                      d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6a6 6 0 0 1-6 6 6 6 0 0 1-6-6H4a8 8 0 0 0 8 8 8 8 0 0 0 8-8c0-4.42-3.58-8-8-8Z"

                      transform="translate(24 0) scale(-1 1)"
                      d="M12 5V1L7 6l5 5V7c3.31 0 6 2.69 6 6a6 6 0 0 1-6 6 6 6 0 0 1-6-6H4a8 8 0 0 0 8 8 8 8 0 0 0 8-8c0-4.42-3.58-8-8-8Z"
                    />
                  </svg>
                </button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </main>

    <dialog id="saveDesignDialog" class="save-design-dialog" aria-labelledby="saveDesignDialogTitle">
      <div class="save-design-dialog__panel">
        <h2 id="saveDesignDialogTitle" class="save-design-dialog__title">保存方案</h2>
        <label class="save-design-dialog__label">
          保存名称
          <input
            id="saveDesignNameInput"
            class="save-design-dialog__input"
            type="text"
            name="saveDesignName"
            autocomplete="off"
            maxlength="120"
          />
        </label>
        <p id="saveDesignNameError" class="save-design-dialog__error" role="alert" hidden></p>
        <div class="save-design-dialog__actions">
          <button type="button" class="save-design-dialog__cancel" id="saveDesignCancelBtn">取消</button>
          <button type="button" class="btn-primary btn-save" id="saveDesignConfirmBtn">保存</button>
        </div>
      </div>
    </dialog>

    <dialog id="newSceneUnsavedDialog" class="save-design-dialog" aria-labelledby="newSceneUnsavedTitle">
      <div class="save-design-dialog__panel">
        <h2 id="newSceneUnsavedTitle" class="save-design-dialog__title">新建场景</h2>
        <p class="save-design-dialog__hint">当前画布有未保存的更改，是否先保存再新建？</p>
        <div class="save-design-dialog__actions save-design-dialog__actions--triple">
          <button type="button" class="save-design-dialog__cancel" id="newSceneUnsavedCancel">取消</button>
          <button type="button" class="save-design-dialog__cancel" id="newSceneUnsavedDiscard">不保存</button>
          <button type="button" class="btn-primary btn-save" id="newSceneUnsavedSave">保存</button>
        </div>
      </div>
    </dialog>
